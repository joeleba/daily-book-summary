name: Publish & Email Book Digest

on:
  push:
    branches:
      - main
    paths:
      - "posts.json"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email for the latest entry"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-book-ideas-publish
  cancel-in-progress: false

jobs:
  publish-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate posts.json and ensure docs/ is up to date
        run: |
          python3 -m json.tool posts.json > /dev/null
          python3 scripts/build_site.py

      - name: Commit rebuilt docs if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "docs/ is already up to date."
          else
            git commit -m "Rebuild static site from posts.json"
            git push
          fi

      - name: Detect newly added post(s)
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.send_email }}" == "true" ]]; then
              LATEST_ID=$(python3 -c '
          import json
          posts = json.load(open("posts.json", encoding="utf-8")).get("posts") or []
          if posts:
              indexed = list(enumerate(posts))
              indexed.sort(key=lambda item: (str(item[1].get("date") or ""), item[0]), reverse=True)
              print(indexed[0][1].get("id", ""))
          ')
              echo "new_ids=$LATEST_ID" >> "$GITHUB_OUTPUT"
            else
              echo "new_ids=" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          NEW_IDS=$(python3 -c '
          import json, subprocess, sys
          curr_posts = json.load(open("posts.json", encoding="utf-8")).get("posts") or []
          try:
              prev_raw = subprocess.check_output(["git", "show", "HEAD~1:posts.json"], text=True, stderr=subprocess.DEVNULL)
              prev_posts = json.loads(prev_raw).get("posts") or []
          except Exception:
              prev_posts = []
          prev_ids = {str(p.get("id") or "") for p in prev_posts}
          added = [str(p.get("id") or "") for p in curr_posts if str(p.get("id") or "") and str(p.get("id") or "") not in prev_ids]
          print(" ".join(added))
          ')
          echo "new_ids=$NEW_IDS" >> "$GITHUB_OUTPUT"
          echo "Detected newly added post IDs: ${NEW_IDS:-none}"

      - name: Email newly added digest(s)
        if: steps.detect.outputs.new_ids != ''
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
        run: |
          for POST_ID in ${{ steps.detect.outputs.new_ids }}; do
            python3 scripts/send_email.py --post-id "$POST_ID"
          done
